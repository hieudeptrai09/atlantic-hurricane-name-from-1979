<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlantic hurricane name lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef2f5;
    --ink: #1c2a36;
    --muted: #5d6d7a;
    --line: #c9d3db;
    --pink: #e04f8a;
    --pink-bg: #fde4ee;
    --blue: #2f6fd0;
    --blue-bg: #dfeafb;
    --tile: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121a21; --ink: #e6edf2; --muted: #93a3b0; --line: #2a3843;
      --pink: #ff7fb0; --pink-bg: #3a1d2a; --blue: #7aa9ff; --blue-bg: #1b2a44; --tile: #18232c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121a21; --ink: #e6edf2; --muted: #93a3b0; --line: #2a3843;
    --pink: #ff7fb0; --pink-bg: #3a1d2a; --blue: #7aa9ff; --blue-bg: #1b2a44; --tile: #18232c;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.6rem);
    line-height: 1; margin: 0 0 .5rem; letter-spacing: -.01em;
  }
  .intro { color: var(--muted); max-width: 62ch; margin: 0 0 1.5rem; }

  section.set { margin-bottom: 2.5rem; padding: 1rem; border-radius: 10px; border: 2px solid transparent; }
  section.set.active { border-color: var(--ink); background: var(--tile); }
  .set-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; margin-bottom: .75rem; }
  .set-head h2 {
    font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.6rem; margin: 0;
  }
  .years { color: var(--muted); font-size: .95rem; }
  .years b { color: var(--ink); }
  .in-use { font-size: .85rem; font-weight: 500; background: var(--ink); color: var(--bg); padding: .1rem .5rem; border-radius: 999px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
  .tile {
    position: relative; border-radius: 6px; padding: .55rem .7rem .6rem 2.4rem;
    min-height: 4.2rem; border-left: 5px solid;
  }
  .tile.pink { background: var(--pink-bg); border-color: var(--pink); }
  .tile.blue { background: var(--blue-bg); border-color: var(--blue); }
  .letter {
    position: absolute; left: .55rem; top: .35rem;
    font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 1.6rem; line-height: 1;
  }
  .pink .letter { color: var(--pink); } .blue .letter { color: var(--blue); }
  .names { list-style: none; margin: 0; padding: 0; }
  .names li {
    font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.2rem; line-height: 1.3;
  }
  .names .yr { font-weight: 400; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Atlantic hurricane name lists</h1>
  <p class="intro">Six lists rotate every six years. Names alternate pink and blue within each list, and each list starts on the opposite color from the one before. Each letter lists its names in the order they were introduced.</p>

  <div id="sets"></div>
</main>

<script>
const names = [
  [[{name:"Ana",first:1979}],[{name:"Bob",first:1979},{name:"Bill",first:1997}],[{name:"Claudette",first:1979}],[{name:"David",first:1979},{name:"Danny",first:1985}],[{name:"Elena",first:1979},{name:"Erika",first:1991},{name:"Elsa",first:2021}],[{name:"Frederic",first:1979},{name:"Fabian",first:1985},{name:"Fred",first:2009}],[{name:"Gloria",first:1979},{name:"Grace",first:1991}],[{name:"Henri",first:1979}],[{name:"Isabel",first:1979},{name:"Ida",first:2009},{name:"Imani",first:2027}],[{name:"Juan",first:1979},{name:"Joaquin",first:2009},{name:"Julian",first:2021}],[{name:"Kate",first:1979}],[{name:"Larry",first:1979}],[{name:"Mindy",first:1979}],[{name:"Nicholas",first:1979}],[{name:"Odette",first:1979}],[{name:"Peter",first:1979}],[{name:"Rose",first:1979}],[{name:"Sam",first:1979}],[{name:"Teresa",first:1979}],[{name:"Victor",first:1979}],[{name:"Wanda",first:1979}]],
  [[{name:"Allen",first:1980},{name:"Andrew",first:1986},{name:"Alex",first:1998}],[{name:"Bonnie",first:1980}],[{name:"Charley",first:1980},{name:"Colin",first:2010}],[{name:"Danielle",first:1980}],[{name:"Earl",first:1980}],[{name:"Frances",first:1980},{name:"Fiona",first:2010},{name:"Farrah",first:2028}],[{name:"Georges",first:1980},{name:"Gaston",first:2004}],[{name:"Hermine",first:1980}],[{name:"Ivan",first:1980},{name:"Igor",first:2010},{name:"Ian",first:2016},{name:"Idris",first:2028}],[{name:"Jeanne",first:1980},{name:"Julia",first:2010}],[{name:"Karl",first:1980}],[{name:"Lisa",first:1980}],[{name:"Mitch",first:1980},{name:"Matthew",first:2004},{name:"Martin",first:2022}],[{name:"Nicole",first:1980}],[{name:"Otto",first:1980},{name:"Owen",first:2022}],[{name:"Paula",first:1980}],[{name:"Richard",first:1980}],[{name:"Shary",first:1980}],[{name:"Tomas",first:1980},{name:"Tobias",first:2016}],[{name:"Virginie",first:1980}],[{name:"Walter",first:1980}]],
  [[{name:"Arlene",first:1981}],[{name:"Bret",first:1981}],[{name:"Cindy",first:1981}],[{name:"Dennis",first:1981},{name:"Don",first:2011}],[{name:"Emily",first:1981}],[{name:"Floyd",first:1981},{name:"Frankin",first:2005}],[{name:"Gert",first:1981}],[{name:"Harvey",first:1981},{name:"Harold",first:2023}],[{name:"Irene",first:1981},{name:"Irma",first:2017},{name:"Idalia",first:2023}],[{name:"Jose",first:1981}],[{name:"Katrina",first:1981},{name:"Katia",first:2011}],[{name:"Lenny",first:1981},{name:"Lee",first:2005}],[{name:"Maria",first:1981},{name:"Margot",first:2023}],[{name:"Nate",first:1981},{name:"Nigel",first:2023}],[{name:"Ophelia",first:1981}],[{name:"Philippe",first:1981}],[{name:"Rita",first:1981},{name:"Rina",first:2011}],[{name:"Stan",first:1981},{name:"Sean",first:2011}],[{name:"Tammy",first:1981}],[{name:"Vince",first:1981}],[{name:"Wilma",first:1981},{name:"Whitney",first:2011}]],
  [[{name:"Alberto",first:1982}],[{name:"Beryl",first:1982},{name:"Brianna",first:2030}],[{name:"Chris",first:1982}],[{name:"Debby",first:1982}],[{name:"Ernesto",first:1982}],[{name:"Florence",first:1982},{name:"Francine",first:2024}],[{name:"Gilbert",first:1982},{name:"Gordon",first:1994}],[{name:"Helene",first:1982},{name:"Holly",first:2030}],[{name:"Isaac",first:1982}],[{name:"Joan",first:1982},{name:"Joyce",first:1994}],[{name:"Keith",first:1982},{name:"Kirk",first:2006}],[{name:"Leslie",first:1982}],[{name:"Michael",first:1982},{name:"Milton",first:2024},{name:"Miguel",first:2030}],[{name:"Nadine",first:1982}],[{name:"Oscar",first:1982}],[{name:"Patty",first:1982}],[{name:"Rafael",first:1982}],[{name:"Sandy",first:1982},{name:"Sara",first:2018}],[{name:"Tony",first:1982}],[{name:"Valerie",first:1982}],[{name:"William",first:1982}]],
  [[{name:"Alicia",first:1983},{name:"Allison",first:1989},{name:"Andrea",first:2007}],[{name:"Barry",first:1983}],[{name:"Chantal",first:1983}],[{name:"Dean",first:1983},{name:"Dorian",first:2013},{name:"Dexter",first:2025}],[{name:"Erin",first:1983}],[{name:"Felix",first:1983},{name:"Fernand",first:2013}],[{name:"Gabrielle",first:1983}],[{name:"Hugo",first:1983},{name:"Humberto",first:1995}],[{name:"Iris",first:1983},{name:"Ingrid",first:2007},{name:"Imelda",first:2019}],[{name:"Jerry",first:1983}],[{name:"Karen",first:1983}],[{name:"Luis",first:1983},{name:"Lorenzo",first:2001}],[{name:"Marilyn",first:1983},{name:"Michelle",first:2001},{name:"Melissa",first:2007},{name:"Molly",first:2031}],[{name:"Noel",first:1983},{name:"Nestor",first:2013}],[{name:"Opal",first:1983},{name:"Olga",first:2001}],[{name:"Pablo",first:1983}],[{name:"Roxanne",first:1983},{name:"Rebekah",first:2001}],[{name:"Sebastien",first:1983}],[{name:"Tanya",first:1983}],[{name:"Van",first:1983}],[{name:"Wendy",first:1983}]],
  [[{name:"Arthur",first:1984}],[{name:"Bertha",first:1984}],[{name:"Cesar",first:1984},{name:"Cristobal",first:2002}],[{name:"Dianna",first:1984},{name:"Dolly",first:1996}],[{name:"Edouard",first:1984}],[{name:"Fran",first:1984},{name:"Fay",first:2002}],[{name:"Gustav",first:1984},{name:"Gonzalo",first:2014}],[{name:"Hortense",first:1984},{name:"Hanna",first:2002}],[{name:"Isidore",first:1984},{name:"Ike",first:2008},{name:"Isaias",first:2014}],[{name:"Josephine",first:1984}],[{name:"Klaus",first:1984},{name:"Kyle",first:1996}],[{name:"Lili",first:1984},{name:"Laura",first:2008},{name:"Leah",first:2026}],[{name:"Marco",first:1984}],[{name:"Nana",first:1984}],[{name:"Omar",first:1984}],[{name:"Paloma",first:1984},{name:"Paulette",first:2014}],[{name:"Rene",first:1984}],[{name:"Sally",first:1984}],[{name:"Teddy",first:1984}],[{name:"Vicky",first:1984}],[{name:"Wilfred",first:1984}]],
];

const setsEl = document.getElementById("sets");
const BASE = 1979;

function render(year) {
  const activeSet = (year - BASE) % 6;
  setsEl.innerHTML = "";

  names.forEach((set, s) => {
    const sec = document.createElement("section");
    sec.className = "set" + (s === activeSet ? " active" : "");

    const start = BASE + s;
    const next = start + Math.ceil((year + 1 - start) / 6) * 6;

    sec.innerHTML = `
      <div class="set-head">
        <h2>List ${s + 1}</h2>
        <span class="years">Every 6 years since ${start}, next in ${next}</span>
        ${s === activeSet ? `<span class="in-use">In use in ${year}</span>` : ""}
      </div>`;

    const grid = document.createElement("div");
    grid.className = "grid";

    set.forEach((entries, l) => {
      // Pink for A in 1979 (set 0, letter 0), blue for A in 1980, alternating by letter.
      const color = (s + l) % 2 === 0 ? "pink" : "blue";
      const letter = entries[0].name[0];

      const items = [...entries]
        .sort((a, b) => a.first - b.first)
        .map(e => `<li>${e.name} <span class="yr">${e.first}</span></li>`)
        .join("");

      const tile = document.createElement("div");
      tile.className = `tile ${color}`;
      tile.innerHTML = `
        <span class="letter">${letter}</span>
        <ul class="names">${items}</ul>`;
      grid.appendChild(tile);
    });

    sec.appendChild(grid);
    setsEl.appendChild(sec);
  });
}

render(new Date().getFullYear());
</script>
</body>
</html>
